[project]
name = "awaazsaathi-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "scikit-learn>=1.5",
  "python-multipart>=0.0.9",
  "qrcode>=7.4",
  "edge-tts>=7.0",
  "cryptography>=50.0.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
